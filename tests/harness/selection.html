<!doctype html>
<meta charset="utf-8">
<title>Reasoning selection acceptance</title>
<style>
  #mount { position: fixed; top: min(170px, calc(100vh - 60px)); right: 24px; }
  #out { max-width: 45%; white-space: pre-wrap; font-size: 11px; }
</style>
<body>
<div id="mount"></div><pre id="out">Running…</pre>
<script src="./react-globals.js"></script>
<script>window.__ModuleLoader__ = { load: module => { window.clientModule = module } }</script>
<script src="./plugin.js"></script>
<script>
;(async () => {
  const results = []
  const check = (name, value) => { results.push({ name, ok: Boolean(value) }); if (!value) throw new Error(name) }
  const wait = () => new Promise(resolve => setTimeout(resolve, 100))
  const t = (key, params = {}) => Object.entries(params).reduce((text, [name, value]) => text.replaceAll(`{${name}}`, value), window.labels[key] ?? key)
  const listeners = new Set()
  let state = { current: { provider: 'p', model: 'm', reasoningEffort: 'high' }, routable: true, status: 'ready', error: null, failures: [],
    groups: [
      { id: 'before', name: 'Earlier provider', models: Array.from({ length: 16 }, (_, i) => ({ id: 'before-' + i, name: 'Earlier model ' + i })) },
      { id: 'p', name: 'Provider', models: [{ id: 'm', name: 'Model', reasoning: { defaultEffort: 'high', efforts: [{ id: 'off', name: 'Off' }, { id: 'high', name: 'High' }, { id: 'max', name: 'Max' }] } }] },
      { id: 'after', name: 'Later provider', models: Array.from({ length: 4 }, (_, i) => ({ id: 'after-' + i, name: 'Later model ' + i })) },
    ] }
  const publish = next => { state = next; for (const listener of listeners) listener() }
  let accepted = false
  let deferProjection = false
  let refreshOnLoad = null
  const selections = []
  const directory = {
    store: { subscribe: listener => { listeners.add(listener); return () => listeners.delete(listener) }, getSnapshot: () => state },
    load: async () => {
      if (refreshOnLoad) {
        const next = refreshOnLoad
        refreshOnLoad = null
        publish(next)
      }
      return state
    },
    select: async selection => {
      selections.push(selection)
      if (!accepted) return { ok: false, error: { message: 'Controlled refusal' } }
      publish({ ...state, current: deferProjection ? state.current : selection })
      return { ok: true, value: undefined }
    },
  }
  const captured = []
  const disposers = []
  const locale = { register: () => () => {}, getLocale: () => ({ active: 'zh' }) }
  const directories = { directoryFor: () => directory }
  /* The real ctx answers `ctx.get('slots')` from the same service store as the
     `ctx.slots` property; the harness must model that. */
  const slots = { inject: (_name, fn) => { const dispose = fn(); disposers.push(dispose) }, register: (meta, component) => { captured.push({ meta, component }); return () => {} } }
  const connection = { rpc: { call: async () => ({ ok: true, value: { needsGuide: false, current: [], expected: [], matched: false, note: null, noteKey: null } }) } }
  const ctx = { locale, get: name => name === 'modelDirectories' ? directories : name === 'locale' ? locale : name === 'slots' ? slots : name === 'connection' ? connection : undefined,
    effect: fn => { const dispose = fn(); disposers.push(dispose); return dispose },
    slots,
  }
  try {
    const plugin = window.clientModule.factory(name => {
      if (name === 'react') return window.React
      if (name === 'react/jsx-runtime') return window.jsxRuntime
      throw new Error(`Unexpected import: ${name}`)
    })
    plugin.apply(ctx)
    check('Every Cordis effect supplies a disposer, including empty palette CSS', disposers.every(fn => typeof fn === 'function'))
    const seat = captured.find(row => row.meta.name === 'conversation.input.model')
    check('Actual plugin model seat registered', seat !== undefined)
    const sessionId = 'rung-test-' + crypto.randomUUID()
    const props = { ...seat.meta.inject(sessionId), t }
    check('Resolved RemoteResult refusal is reported as false', await props.select({ ...state.current }) === false)
    selections.length = 0
    const root = window.createRoot(document.getElementById('mount'))
    const mountSeat = id => root.render(window.React.createElement(seat.component, { ...seat.meta.inject(id), t, key: id }))
    mountSeat(sessionId)
    await wait()
    document.querySelector('.re-model-trigger').click()
    await wait()
    const depthMenu = document.querySelector('.re-model-menu')
    const depthFrame = { width: depthMenu.offsetWidth, height: depthMenu.offsetHeight }
    document.querySelector('.re-model-row').click()
    await wait()
    const modelMenu = document.querySelector('.re-model-menu')
    const modelFrame = { width: modelMenu.offsetWidth, height: modelMenu.offsetHeight }
    check('Model list matches the depth panel width', modelFrame.width === depthFrame.width)
    check('Model list can grow taller than the depth panel', modelFrame.height > depthFrame.height)
    check('Opening the list focuses the selected model', document.activeElement.matches('[role="menuitemradio"][aria-checked="true"]'))
    const list = document.querySelector('.re-model-list')
    const back = document.querySelector('.re-model-back')
    const headerFrame = back.getBoundingClientRect()
    check('A selected model deep in the list scrolls into view', list.scrollTop > 0)
    if (innerHeight >= 500) {
      const listFrame = list.getBoundingClientRect()
      const visible = [...list.querySelectorAll('.re-model-option')].filter(option => {
        const frame = option.getBoundingClientRect()
        return frame.top >= listFrame.top - .5 && frame.bottom <= listFrame.bottom + .5
      })
      check('Five complete model rows are visible', visible.length === 5)
      check('The list opens below when the upper space is too short', modelMenu.getBoundingClientRect().top >= document.querySelector('.re-model-root').getBoundingClientRect().bottom)
    }
    const placedFrame = modelMenu.getBoundingClientRect()
    check('The list remains inside the viewport', placedFrame.top >= 0 && placedFrame.bottom <= innerHeight)
    const headerIsClear = () => {
      const header = back.getBoundingClientRect()
      return list.getBoundingClientRect().top >= header.bottom
        && back.contains(document.elementFromPoint(header.x + header.width / 2, header.y + header.height / 2))
    }
    check('Scrolled models cannot paint over the return header', headerIsClear())
    list.scrollTop = list.scrollHeight
    check('Scrolling to the end keeps the header in place', headerIsClear() && back.getBoundingClientRect().top === headerFrame.top)
    const last = list.querySelector('section:last-of-type button:last-of-type')
    const lastFrame = last.getBoundingClientRect()
    check('The last model remains reachable', last.contains(document.elementFromPoint(lastFrame.x + lastFrame.width / 2, lastFrame.y + lastFrame.height / 2)))
    publish({ ...state, status: 'selecting' })
    await wait()
    check('The list keeps a focusable return path while model choices are disabled', document.activeElement.matches('.re-model-back'))
    publish({ ...state, status: 'ready' })
    await wait()
    document.activeElement.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }))
    await wait()
    check('Escape returns focus to the model row', document.activeElement.matches('.re-model-row'))
    const slider = document.querySelector('input[type=range]')
    check('A sparse model still offers all seven display positions', slider?.max === '6')
    slider.dispatchEvent(new KeyboardEvent('keydown', { key: 'End', bubbles: true }))
    await wait()
    check('Slider sends declared max, never its Ultra label', selections[0]?.reasoningEffort === 'max')
    check('Refused slider choice rolls back', state.current.reasoningEffort === 'high' && document.querySelector('.re-depth-value').textContent === 'High')
    check('Refusal remains visible', document.querySelector('.re-effort').title.includes('Controlled refusal'))
    const before = selections.length
    publish({ ...state, current: { ...state.current, reasoningEffort: 'max' }, groups: [{ id: 'p', name: 'Provider', models: [{ id: 'm', name: 'Model', reasoning: { defaultEffort: 'high', efforts: [{ id: 'off', name: 'Off' }, { id: 'high', name: 'High' }] } }] }] })
    await wait()
    check('Refresh never automatically selects an effort', selections.length === before)
    check('Invalid value shown on trigger and slider', document.querySelector('.re-model-trigger').textContent.includes('max') && document.querySelector('.re-depth-value').textContent.includes('max'))
    check('Invalid slider is labelled unavailable', document.querySelector('.re-depth-value').textContent.includes('已失效'))
    publish({ ...state, groups: [{ id: 'p', name: 'Provider', models: [{ id: 'm', name: 'Model' }] }] })
    await wait()
    const recovery = document.querySelector('[role=alert] button')
    check('Disabled capability retains explicit recovery action', recovery !== null)
    accepted = true
    recovery.click()
    await wait()
    check('Only explicit recovery removes the stale effort', !Object.hasOwn(state.current, 'reasoningEffort') && selections.length === before + 1)
    check('Cleared selection no longer shows invalid status', document.querySelector('[role=alert]') === null)
    const withEfforts = ids => ({ ...state, groups: [{ id: 'p', name: 'Provider', models: [{
      id: 'm', name: 'Model', reasoning: { defaultEffort: 'low', efforts: ids.map(id => ({ id, name: id })) },
    }] }] })
    const key = async key => {
      document.querySelector('.re-depth-input').dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }))
      await wait()
    }
    const shows = (name, index) => ['.re-depth-value', '.re-model-effort', '.re-model-row-effort']
      .every(selector => document.querySelector(selector)?.textContent === name)
      && Number(document.querySelector('.re-depth-input').value) === index
    publish({ ...withEfforts(['low', 'high']), current: { ...state.current, reasoningEffort: 'low' } })
    await wait()
    deferProjection = true
    await key('ArrowRight')
    check('Medium stays at position 3 while the submitted high awaits confirmation',
      selections.at(-1).reasoningEffort === 'high' && shows('Medium', 3))
    const awaitingHigh = selections.length
    await key('Home')
    check('A pending host confirmation cannot replace the chosen rung', selections.length === awaitingHigh && shows('Medium', 3))
    const reopen = async () => {
      document.querySelector('.re-model-trigger').click()
      await wait()
      document.querySelector('.re-model-trigger').click()
      await wait()
    }
    await reopen()
    check('Reopening before the host confirms preserves Medium', shows('Medium', 3))
    publish({ ...state, current: selections.at(-1) })
    await wait()
    check('The high confirmation keeps Medium selected', shows('Medium', 3) && !document.querySelector('.re-depth-input').disabled)
    deferProjection = false
    accepted = false
    await key('ArrowRight')
    check('A refused change restores the previous visual position even for the same wire effort', shows('Medium', 3))
    accepted = true
    await key('ArrowRight')
    await reopen()
    check('Choosing High stays at High instead of flying to Ultra', selections.at(-1).reasoningEffort === 'high' && shows('High', 4))
    await key('End')
    await reopen()
    check('Choosing Ultra stays at Ultra although it also submits high', selections.at(-1).reasoningEffort === 'high' && shows('Ultra', 6))
    const openSeat = async id => {
      mountSeat(id)
      await wait()
      document.querySelector('.re-model-trigger').click()
      await wait()
    }
    await openSeat(sessionId + '-other')
    check('Another session has its own display position', shows('High', 4))
    await openSeat(sessionId)
    check('Recreating the model control restores this session’s chosen Ultra', shows('Ultra', 6))
    const original = state
    publish({ ...state, current: { ...state.current, model: 'other' }, groups: [{
      ...state.groups[0], models: [{ ...state.groups[0].models[0], id: 'other' }],
    }] })
    await wait()
    check('Another model has its own display position', shows('High', 4))
    publish(original)
    await wait()
    check('Returning to the original model restores its visual choice', shows('Ultra', 6))
    publish({ ...state, current: { ...state.current, reasoningEffort: 'low' } })
    await wait()
    check('A different effort selected outside the slider takes effect', shows('Low', 2))
    await key('ArrowRight')
    refreshOnLoad = withEfforts(['low', 'medium', 'high', 'max'])
    await key('ArrowRight')
    check('A directory refresh preserves a still valid choice', selections.at(-1).reasoningEffort === 'high' && shows('High', 4))
    const sent = selections.length
    refreshOnLoad = withEfforts(['low', 'high', 'max'])
    await key('ArrowLeft')
    check('A mapping changed during selection sends no substitute', selections.length === sent && shows('High', 4))
  } catch (error) { results.push({ name: error.stack ?? String(error), ok: false }) }
  const failed = results.filter(result => !result.ok).length
  window.__RESULT__ = { pass: results.length - failed, fail: failed, results }
  document.getElementById('out').textContent = `${results.length - failed}/${results.length} passed\n` + results.map(result => `${result.ok ? 'PASS' : 'FAIL'} ${result.name}`).join('\n')
  document.title = failed === 0 ? 'PASS — Reasoning selection' : 'FAIL — Reasoning selection'
})()
</script>
</body>
